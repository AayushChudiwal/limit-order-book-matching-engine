name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build + test (Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Build + test (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # DO NOT REMOVE -UNDEBUG. It is not redundant boilerplate.
      # ============================================================
      # RelWithDebInfo defines NDEBUG. NDEBUG compiles out assert().
      # This engine keeps 8 asserts in src/optimized_order_book.cpp that
      # check the "locations_ points at a level/order that actually
      # exists" invariants -- exactly the class of corruption the step-4
      # arena allocator is most likely to introduce, and exactly what
      # docs/phase5_readiness.md says a behavioural differential test
      # CANNOT see ("correct output, broken program").
      #
      # Without -UNDEBUG this job still passes, still says "ASan + UBSan",
      # and silently tests STRICTLY LESS. A green check that means less
      # than it appears to is worse than a missing one, because nobody
      # goes looking. If you are here to simplify this flag away: the
      # thing it protects is the reason the job exists.
      #
      # It is also not a speed/coverage tradeoff -- measured on this
      # suite, keeping the asserts costs 38.14s vs 38.55s. It is free.
      #
      # (RelWithDebInfo rather than Debug is the speed decision, and a
      # separate one: measured Release 4.25s, RelWithDebInfo+sanitizers
      # 38s (9.1x), Debug+sanitizers 118s (28x). Same sanitizer coverage
      # for 3x less time, which matters with a longer ASan-on-fuzz-corpus
      # job landing on top of this one.)
      - name: Configure
        run: >
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DLOB_ENABLE_SANITIZERS=ON
          -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -g -UNDEBUG"

      - name: Build
        run: cmake --build build-san -j

      # detect_leaks is LINUX-ONLY: on macOS, ASan hard-aborts at startup
      # with "detect_leaks is not supported on this platform", so every
      # test reports "Subprocess aborted" and the failure looks like a
      # real bug rather than a bad env var. It's correct here (this job
      # is ubuntu-latest) but it made the job impossible to reproduce
      # locally on the machine this project is developed on, so it's now
      # set per-platform rather than unconditionally. To run this same
      # job locally on macOS, drop ASAN_OPTIONS entirely:
      #   cmake -S . -B build-san -DCMAKE_BUILD_TYPE=RelWithDebInfo \
      #     -DLOB_ENABLE_SANITIZERS=ON && cmake --build build-san -j
      #   UBSAN_OPTIONS=print_stacktrace=1,halt_on_error=1 \
      #     ctest --test-dir build-san --output-on-failure
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=${{ runner.os == 'Linux' && '1' || '0' }}
          UBSAN_OPTIONS: print_stacktrace=1,halt_on_error=1
        run: ctest --test-dir build-san --output-on-failure

  fuzz-mutation-test:
    name: Phase 3 fuzz -- mutation testing (fast, fixed seeds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j --target fuzz_mutation_test

      # Fixed seeds (1..20 per bug, hardcoded in the tool), so this is
      # exactly as deterministic and fast as any other test here (~1.5s) --
      # not the long randomized sweep, which is fuzz-nightly's job below.
      # Fails the build if ANY of the 7 injected bugs goes uncaught in ANY
      # of its 20 seeds: this is what keeps docs/fuzz_mutation_testing.md's
      # claim ("140/140 caught") from silently rotting as the harness or
      # engine change.
      - name: Run mutation test (must catch all 7 bugs in every seed)
        run: ./build/fuzz_mutation_test

  fuzz-sanitized:
    name: Phase 3 fuzz -- sanitized sweep (ASan + UBSan, both modes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same build shape as the `sanitizers` job above, and -UNDEBUG is
      # load-bearing for the same reason -- see that job's comment. The
      # asserts are a large part of what this sweep is FOR: they are the
      # only in-process check that catches a corrupted internal index
      # before it turns into plausible-looking output.
      - name: Configure
        run: >
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DLOB_ENABLE_SANITIZERS=ON
          -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -g -UNDEBUG"

      - name: Build
        run: cmake --build build-san -j --target fuzz_soak

      # BOTH modes, deliberately shallow (2,000 ops) rather than one mode
      # deeper. Two reasons, both measured:
      #
      # 1. Cost is superlinear in op_count -- roughly O(ops^1.7), because
      #    CheckInvariants runs after every op and scales with book size
      #    (see docs/benchmark_methodology.md, "Fuzz sweep cost"). Running
      #    both modes at 2,000 ops costs ~92s of runner time; running one
      #    mode at 5,000 ops costs ~107s. Both-shallower is strictly
      #    cheaper AND covers both failure classes.
      # 2. For memory safety specifically, seed breadth beats depth: a
      #    use-after-free is triggered by hitting the right SHAPE of
      #    sequence, not by running longer.
      #
      # Neither mode subsumes the other -- a differential is blind to a
      # bug both engines share (they forked; shared-ancestry bugs are
      # live), and invariants are blind to divergence that leaves both
      # books well-formed. See tools/fuzz_soak.cpp's header.
      #
      # Seeds are offset by the run number so consecutive pushes explore
      # fresh ground, while `fuzz_soak <mode> <offset> 40 2000` stays
      # exactly reproducible locally for any offset in the log.
      #
      # BOTH MODES WERE VERIFIED TO ACTUALLY FAIL, not just to pass.
      # A CI job that cannot fail is worse than no job at all: it is a
      # green check that means nothing and that nobody re-examines. So
      # before this job was committed, fuzz_soak was rebuilt against
      # deliberately broken engines from include/lob/fuzz/buggy_order_book.hpp
      # and confirmed to detect them:
      #
      #   BuggyOrderBookVariant<FifoViolatedLifoInstead>
      #     -> differential mode reports the diverging fill and exits 1
      #   BuggyOrderBookVariant<PriceLevelNotRemovedOnLastCancel>
      #     -> invariant mode reports "empty price level left in book"
      #        and exits 1
      #   the real OptimizedOrderBook
      #     -> both modes exit 0
      #
      # If you change fuzz_soak's failure/exit-code plumbing, redo that
      # check. Passing on correct code proves nothing on its own.
      - name: Sanitized sweep -- invariants on OptimizedOrderBook
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1,halt_on_error=1
        run: |
          OFFSET=$(( ${{ github.run_number }} * 40 ))
          echo "seed offset: $OFFSET"
          ./build-san/fuzz_soak invariant-optimized "$OFFSET" 40 2000

      - name: Sanitized sweep -- differential (OrderBook vs OptimizedOrderBook)
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1,halt_on_error=1
        run: |
          OFFSET=$(( ${{ github.run_number }} * 40 ))
          ./build-san/fuzz_soak differential "$OFFSET" 40 2000
